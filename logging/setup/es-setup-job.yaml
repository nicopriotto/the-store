# Crea los usuarios, la política de retención y el index template. Tiene que
# correr antes que Fluentd: un índice creado sin el template queda en yellow.
apiVersion: batch/v1
kind: Job
metadata:
  name: es-setup
  namespace: logging
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: es-setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: setup
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef: {name: es-credentials, key: elastic}
        - name: KIBANA_PASSWORD
          valueFrom:
            secretKeyRef: {name: es-credentials, key: kibana_system}
        - name: FLUENTD_PASSWORD
          valueFrom:
            secretKeyRef: {name: es-credentials, key: fluentd}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          ES=http://elasticsearch.logging.svc.cluster.local:9200
          AUTH="elastic:${ELASTIC_PASSWORD}"
          H='Content-Type: application/json'

          until curl -sf -u "$AUTH" "$ES/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; do
            echo "esperando a Elasticsearch..."; sleep 5
          done

          # Kibana no puede usar el usuario elastic: necesita kibana_system con contraseña
          curl -sf -u "$AUTH" -X POST "$ES/_security/user/kibana_system/_password" -H "$H" \
            -d "{\"password\":\"${KIBANA_PASSWORD}\"}"

          # Fluentd: solo puede crear y escribir los índices k8s-logs-*
          curl -sf -u "$AUTH" -X PUT "$ES/_security/role/fluentd_writer" -H "$H" \
            -d '{"cluster":["monitor"],"indices":[{"names":["k8s-logs-*"],"privileges":["create_index","write"]}]}'
          curl -sf -u "$AUTH" -X PUT "$ES/_security/user/fluentd" -H "$H" \
            -d "{\"password\":\"${FLUENTD_PASSWORD}\",\"roles\":[\"fluentd_writer\"]}"

          # Retención: borrar índices con más de 7 días
          curl -sf -u "$AUTH" -X PUT "$ES/_ilm/policy/k8s-logs-retention" -H "$H" \
            -d '{"policy":{"phases":{"hot":{"actions":{}},"delete":{"min_age":"7d","actions":{"delete":{}}}}}}'

          # Template: 1 shard, 0 réplicas, ILM y tipos de los campos normalizados
          curl -sf -u "$AUTH" -X PUT "$ES/_index_template/k8s-logs" -H "$H" \
            -d '{"index_patterns":["k8s-logs-*"],"priority":200,"template":{"settings":{"number_of_shards":1,"number_of_replicas":0,"index.lifecycle.name":"k8s-logs-retention"},"mappings":{"properties":{"app":{"type":"keyword"},"level":{"type":"keyword"},"status_code":{"type":"integer"},"method":{"type":"keyword"},"path":{"type":"keyword"},"message":{"type":"text"}}}}}'

          echo "setup completo"
